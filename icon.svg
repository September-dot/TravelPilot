<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Ring -->
    <circle r="160" fill="none" stroke="#ffffff" stroke-width="12" stroke-opacity="0.9"/>
    <circle r="140" fill="#ffffff" fill-opacity="0.15"/>
    <!-- Compass Markings -->
    <line x1="0" y1="-155" x2="0" y2="-135" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="155" x2="0" y2="135" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="-155" y1="0" x2="-135" y2="0" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="155" y1="0" x2="135" y2="0" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <!-- Compass Needles -->
    <polygon points="0,-120 32,0 0,20 -32,0" fill="#ffffff"/>
    <polygon points="0,120 32,0 0,-20 -32,0" fill="#fed7aa"/>
    <!-- Center Pivot -->
    <circle r="20" fill="#ea580c" stroke="#ffffff" stroke-width="8"/>
  </g>
</svg>
